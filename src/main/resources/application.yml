server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: devflow
  # ========== MySQL 数据库 ==========
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/devflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # ========== Spring AI（DeepSeek API） ==========
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

# ========== JWT 配置 ==========
jwt:
  secret: ${JWT_SECRET:devflow-jwt-secret-key-change-in-production}
  expiration: 86400000  # 24小时

app:
  registration-enabled: ${REGISTRATION_ENABLED:true}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:false}
    username: ${DEMO_USERNAME:admin}
    password: ${DEMO_PASSWORD:admin123}
  ai:
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:10}

# ========== Knife4j API 文档 ==========
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

# ========== 日志 ==========
logging:
  level:
    com.devflow: debug
    org.springframework.ai: debug
